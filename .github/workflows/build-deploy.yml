name: Build and publish lecodex image

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15

    steps:
      - name: Checkout lecodex
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout intel-codex content
        uses: actions/checkout@v4
        with:
          repository: gl0bal01/intel-codex
          path: content
          fetch-depth: 0

      - name: Clean non-content paths from vault checkout
        run: |
          rm -rf content/.git content/.github content/.claude content/.omc content/.obsidian \
                 content/README.md content/CONTRIBUTING.md content/LICENSE content/CLAUDE.md \
                 content/Cases content/CTF content/Case-Template content/Student-Exercises || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "### Pushed image"
            echo '```'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            printf 'Triggered by: `%s`\n' "$EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
