name: Build and publish lecodex image

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A cold build installs ~31 Quartz plugins inside the image (git clone + npm
    # install + tsup each), which takes ~15 min on its own. Warm builds hit the
    # gha layer cache and finish in a couple of minutes.
    timeout-minutes: 45

    steps:
      - name: Checkout lecodex
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and formatting
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Checkout intel-codex content
        uses: actions/checkout@v6
        with:
          repository: gl0bal01/intel-codex
          path: content
          fetch-depth: 0

      - name: Clean non-content paths from vault checkout
        run: |
          # content/.git is deliberately kept: CreatedModifiedDate reads real commit
          # dates from it during the build. It never reaches the runtime image, which
          # only copies public/ out of the discarded builder stage.
          # Optional cleanups — || true for paths that may not exist in every vault.
          rm -rf content/.github content/.claude content/.omc content/.obsidian \
                 content/README.md content/CONTRIBUTING.md content/LICENSE content/CLAUDE.md \
                 content/Cases/Case-Template content/Cases/Student-Exercises || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Gives the service worker a per-build cache version, so a CSS-only
          # change still invalidates the caches of installed clients.
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Registry cache instead of type=gha: the plugin stage is large and
          # GHA's 10 GB per-repo cap evicted it between runs.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          platforms: linux/amd64

      # Publishing is not deploying. Watchtower pulls on its own schedule and can
      # fail without saying so — it logged `failed=0 updated=0` for 26 days while
      # every pull was rejected — so assert the running site actually serves this
      # commit instead of assuming it does.
      - name: Verify deployment went live
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          deadline=$(( SECONDS + 600 ))
          blocked=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            code=$(curl -sS -o /tmp/version.json -w '%{http_code}' --max-time 15 \
                   "https://lecodex.xyz/version.json?t=$(date +%s)" || echo 000)
            case "$code" in
              200)
                blocked=0
                live=$(sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' /tmp/version.json)
                if [ "$live" = "$EXPECTED_SHA" ]; then
                  echo "live commit: $live"
                  exit 0
                fi
                echo "waiting — live commit is '${live:-unknown}', expected '$EXPECTED_SHA'"
                ;;
              403|503)
                # Cloudflare challenges GitHub's datacenter ranges, so the check
                # cannot see the site at all. That is a different failure from a
                # dead deploy and must not be reported as one.
                blocked=1
                echo "blocked by the edge (HTTP $code)"
                ;;
              *)
                blocked=0
                echo "waiting — HTTP $code"
                ;;
            esac
            sleep 30
          done
          if [ "$blocked" = "1" ]; then
            echo "::warning::Could not verify the deploy: lecodex.xyz returns 403 to GitHub runners."
            echo "::warning::Add a Cloudflare WAF skip rule for /version.json to make this check meaningful."
            exit 0
          fi
          echo "::error::lecodex.xyz still does not serve $EXPECTED_SHA after 10 minutes."
          echo "::error::The image published fine, so this is the deploy step: check watchtower on the host."
          exit 1

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "### Pushed image"
            echo '```'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            printf 'Triggered by: `%s`\n' "$EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
