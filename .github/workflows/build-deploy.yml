name: Build and publish lecodex image

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A cold build installs ~31 Quartz plugins inside the image (git clone + npm
    # install + tsup each), which takes ~15 min on its own. Warm builds hit the
    # gha layer cache and finish in a couple of minutes.
    timeout-minutes: 45

    steps:
      - name: Checkout lecodex
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and formatting
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Checkout intel-codex content
        uses: actions/checkout@v6
        with:
          repository: gl0bal01/intel-codex
          path: content
          fetch-depth: 0

      - name: Clean non-content paths from vault checkout
        run: |
          # .git must be removed so it doesn't ship in the image; fail loudly if it can't.
          rm -rf content/.git
          # Optional cleanups — || true for paths that may not exist in every vault.
          rm -rf content/.github content/.claude content/.omc content/.obsidian \
                 content/README.md content/CONTRIBUTING.md content/LICENSE content/CLAUDE.md \
                 content/Cases/Case-Template content/Cases/Student-Exercises || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "### Pushed image"
            echo '```'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
            printf 'Triggered by: `%s`\n' "$EVENT_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
