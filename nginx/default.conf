server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # Strict-Transport-Security applies only when served over HTTPS (Traefik terminates TLS).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP allows the CDN-loaded fonts/scripts Quartz uses (cdnjs for mermaid, pixi, d3) plus giscus.
    # 'unsafe-eval' required by explorer (deserializes sort/filter/map config) and mermaid/PixiJS.
    # worker-src blob: needed for FlexSearch web worker.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://giscus.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self'; worker-src 'self' blob:; frame-src https://giscus.app; base-uri 'self'; form-action 'self'" always;

    # Brand icons + favicon: short cache + revalidate so updates propagate
    location = /favicon.ico {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
        try_files $uri =404;
    }
    location ^~ /static/icon {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
        try_files $uri =404;
    }
    location = /static/apple-touch-icon.png {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
        try_files $uri =404;
    }
    location = /static/og-image.png {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # Service worker: must always revalidate so updates propagate on next load.
    # Re-list server-level security headers because nginx `add_header` inheritance
    # is replaced (not merged) once any add_header appears in a child location.
    location = /sw.js {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
        try_files $uri =404;
    }

    # Quartz emits its entry points under stable names — index.css, prescript.js
    # and postscript.js are rewritten in place on every build. Serving them
    # immutable pins a stale copy in every browser and at the CDN for the full
    # TTL, so they only get a short cache plus revalidation (ETag makes the
    # revalidation a cheap 304).
    location ~* ^/(index\.css|prescript\.js|postscript\.js)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Genuinely stable assets: fonts and images keep the long immutable cache.
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Short cache for HTML so updates propagate fast
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # RSS / sitemap
    # Deploy marker: CI polls this to confirm the running container is the image
    # it just published, so it must never be served from a cache.
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    location ~* \.(xml|json|txt)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Quartz uses extensionless URLs (e.g. /Investigations/Investigations-Index).
    # Canonical URLs are emitted with a trailing slash, so resolve $uri.html and
    # $uri/index.html directly rather than redirecting trailing slashes away
    # (which fought the canonical and produced double-redirect / link breakage).
    location / {
        try_files $uri $uri.html $uri/index.html =404;

        # Pages are served extensionless, so the `\.html$` block below never
        # matches them and they went out with no Cache-Control at all — which
        # made Cloudflare bypass its cache and send every page view to this
        # container. `expires` rather than `add_header` on purpose: add_header
        # in a location replaces the inherited set, which would silently drop
        # the security headers from every page.
        expires 5m;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
